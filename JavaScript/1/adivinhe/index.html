<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Adivinhe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Adivinhe o número</h1>
        <div class="card">
            <p>Pensei em um número de 1 a 10.</p>
            <input id="palpite" type="number" min="1" max="10" placeholder="Digite um número" style="width: 15 0px">
            <div class="botoes">
                <button id="tentar">Tentar</button>
                <button id="reiniciar">Novo jogo</button>
            </div>
            <p id="mensagem">Faça seu primeiro palpite.</p>
            <p id="tentativas">Tentativas: 0</p>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de média</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="caixa">
        <h1>Calculadora de média</h1>
        <label>Nota 1 <input id="n1" type="number" min="0" max="10"></label>
        <label>Nota 2 <input id="n2" type="number" min="0" max="10"></label>
        <label>Nota 3 <input id="n3" type="number" min="0" max="10"></label>
        <label>Nota 4 <input id="n4" type="number" min="0" max="10"></label>
        <button id="calcular">Calcular</button>
        <p id="resultado">Preencha as notas.</p>
    </main>
    <script src="script.js"></script>
</body>

</html>
